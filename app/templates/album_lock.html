{% extends "base.html" %}
{% block title %}Locked · {{ album.title }}{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>🔒 {{ album.title }}</h1>
  <p class="muted">This album is password protected.</p>
  {% if error %}
  <div class="alert error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/a/{{ album.slug }}/unlock" class="stack">
    <label>
      Password
      <input type="password" name="password" required autofocus />
    </label>
    <button type="submit" class="btn primary">Unlock</button>
  </form>
</section>
{% endblock %}
